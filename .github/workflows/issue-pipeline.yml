# Generated by nooticr-server/ops/gen_workflows.py; edit that, then re-run it.
name: Issue pipeline

# #product: a new issue is triaged (a Claude session, /triage).
# #eng: an issue labelled `ready` is implemented (/implement), which opens a
# draft PR that enters the PR pipeline. Each posts one line to its Slack channel.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue:
        type: number
        required: true
      mode:
        type: choice
        options: [triage, implement]
        required: true

permissions: {}

jobs:
  triage:
    name: "product: triage"
    if: (github.event_name == 'issues' && github.event.action == 'opened') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'triage')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: The inputs are what they claim to be
        if: github.event_name == 'workflow_dispatch'
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          [[ "$ISSUE" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::issue is not an issue number"; exit 1; }
      - uses: actions/checkout@v4
      - name: Pick the sibling branches
        id: sibling-refs
        # A change spread over the three repos lives on one branch name in each;
        # checking this repo's branch against the siblings' main would test a
        # combination that will never exist. Same name if the sibling has it,
        # main otherwise.
        env:
          TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          BRANCH: main
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-server" "$BRANCH" >/dev/null 2>&1; then echo "server=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "server=main" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-dashboard" "$BRANCH" >/dev/null 2>&1; then echo "dashboard=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "dashboard=main" >> "$GITHUB_OUTPUT"; fi
      - name: Check out nooticr-server
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-server
          ref: ${{ steps.sibling-refs.outputs.server }}
          path: _siblings/nooticr-server
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Check out nooticr-dashboard
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-dashboard
          ref: ${{ steps.sibling-refs.outputs.dashboard }}
          path: _siblings/nooticr-dashboard
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Keep the sibling checkouts out of this repo's diff
        run: echo '_siblings/' >> .git/info/exclude
      - name: Say which siblings are missing, and why
        env:
          HAS_TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN != '' }}
        run: |
          why="NOOTICR_VERIFY_TOKEN is set but cannot read it"; [ "$HAS_TOKEN" = true ] || why="NOOTICR_VERIFY_TOKEN is not set, and this job's own token cannot read another private repo (nooticr-server/ops/README.md, setup step 7)"
          git -C _siblings/nooticr-server rev-parse -q --verify HEAD >/dev/null 2>&1 || { echo "::error::nooticr-server could not be checked out, and the verify toolkit lives there: $why"; exit 1; }
          git -C _siblings/nooticr-dashboard rev-parse -q --verify HEAD >/dev/null 2>&1 || { echo "::warning::nooticr-dashboard could not be checked out, and rules spanning it report NOT CHECKED: $why"; }
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/triage ${{ github.event.issue.number || inputs.issue }}"
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh label list:*)"
      - name: Check out the pipeline's own code (nooticr-server main)
        id: pipeline-code
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Say why the pipeline's code is missing
        if: failure() && steps.pipeline-code.outcome == 'failure'
        env:
          HAS_TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then echo "::error::nooticr-server could not be checked out: NOOTICR_VERIFY_TOKEN is not set, and this job's own token cannot read another private repo (nooticr-server/ops/README.md, setup step 7)."; else echo "::error::nooticr-server main could not be checked out with NOOTICR_VERIFY_TOKEN, or has no ops/pipeline yet (it arrives with the PR that adds it)."; fi
          exit 1
      - name: Tell #product
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PRODUCT_CHANNEL: ${{ vars.SLACK_PRODUCT_CHANNEL }}
          URL: ${{ github.event.issue.html_url || format('{0}/{1}/issues/{2}', github.server_url, github.repository, inputs.issue) }}
        run: |
          python3 _pipeline/ops/pipeline/notify.py --channel-var SLACK_PRODUCT_CHANNEL --text "Triaged <$URL|${{ github.repository }}#${{ github.event.issue.number || inputs.issue }}>"
  implement:
    name: "eng: implement"
    if: (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ready') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'implement')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: The inputs are what they claim to be
        if: github.event_name == 'workflow_dispatch'
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          [[ "$ISSUE" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::issue is not an issue number"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the sibling branches
        id: sibling-refs
        # A change spread over the three repos lives on one branch name in each;
        # checking this repo's branch against the siblings' main would test a
        # combination that will never exist. Same name if the sibling has it,
        # main otherwise.
        env:
          TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          BRANCH: claude/issue-${{ github.event.issue.number || inputs.issue }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-server" "$BRANCH" >/dev/null 2>&1; then echo "server=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "server=main" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-dashboard" "$BRANCH" >/dev/null 2>&1; then echo "dashboard=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "dashboard=main" >> "$GITHUB_OUTPUT"; fi
      - name: Check out nooticr-server
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-server
          ref: ${{ steps.sibling-refs.outputs.server }}
          path: _siblings/nooticr-server
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Check out nooticr-dashboard
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-dashboard
          ref: ${{ steps.sibling-refs.outputs.dashboard }}
          path: _siblings/nooticr-dashboard
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Keep the sibling checkouts out of this repo's diff
        run: echo '_siblings/' >> .git/info/exclude
      - name: Say which siblings are missing, and why
        env:
          HAS_TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN != '' }}
        run: |
          why="NOOTICR_VERIFY_TOKEN is set but cannot read it"; [ "$HAS_TOKEN" = true ] || why="NOOTICR_VERIFY_TOKEN is not set, and this job's own token cannot read another private repo (nooticr-server/ops/README.md, setup step 7)"
          git -C _siblings/nooticr-server rev-parse -q --verify HEAD >/dev/null 2>&1 || { echo "::error::nooticr-server could not be checked out, and the verify toolkit lives there: $why"; exit 1; }
          git -C _siblings/nooticr-dashboard rev-parse -q --verify HEAD >/dev/null 2>&1 || { echo "::warning::nooticr-dashboard could not be checked out, and rules spanning it report NOT CHECKED: $why"; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/implement ${{ github.event.issue.number || inputs.issue }}"
          claude_args: --max-turns 150
      - name: Check out the pipeline's own code (nooticr-server main)
        id: pipeline-code
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Say why the pipeline's code is missing
        if: failure() && steps.pipeline-code.outcome == 'failure'
        env:
          HAS_TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then echo "::error::nooticr-server could not be checked out: NOOTICR_VERIFY_TOKEN is not set, and this job's own token cannot read another private repo (nooticr-server/ops/README.md, setup step 7)."; else echo "::error::nooticr-server main could not be checked out with NOOTICR_VERIFY_TOKEN, or has no ops/pipeline yet (it arrives with the PR that adds it)."; fi
          exit 1
      - name: Tell #eng
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ENG_CHANNEL: ${{ vars.SLACK_ENG_CHANNEL }}
          RESULT: ${{ job.status }}
        run: |
          python3 _pipeline/ops/pipeline/notify.py --channel-var SLACK_ENG_CHANNEL --text "Implementation of ${{ github.repository }}#${{ github.event.issue.number || inputs.issue }}: $RESULT"
