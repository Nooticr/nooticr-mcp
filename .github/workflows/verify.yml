# Generated by nooticr-server/ops/gen_workflows.py; edit that, then re-run it.
name: Verify

# nooticr-verify in CI: the same rules the Claude Code hooks enforce in a
# session (nooticr-server/verify/rules.json), run where nobody can skip them.
#
# A separate workflow from ci.yml on purpose: ci.yml gates deploys. The sibling
# checkouts need NOOTICR_VERIFY_TOKEN (read access to the three repos); without
# it the rules spanning repos report NOT CHECKED and this job fails saying so.
# PR labels `verify-allow:<flag>` are the CI form of a user's explicit permission.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: nooticr-verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOOTICR_REPOS_ROOT: ${{ github.workspace }}/_siblings
      NOOTICR_VERIFY_BASE: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the sibling branches
        id: sibling-refs
        # A change spread over the three repos lives on one branch name in each;
        # checking this repo's branch against the siblings' main would test a
        # combination that will never exist. Same name if the sibling has it,
        # main otherwise.
        env:
          TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-server" "$BRANCH" >/dev/null 2>&1; then echo "server=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "server=main" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-dashboard" "$BRANCH" >/dev/null 2>&1; then echo "dashboard=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "dashboard=main" >> "$GITHUB_OUTPUT"; fi
      - name: Check out nooticr-server
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-server
          ref: ${{ steps.sibling-refs.outputs.server }}
          path: _siblings/nooticr-server
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Check out nooticr-dashboard
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-dashboard
          ref: ${{ steps.sibling-refs.outputs.dashboard }}
          path: _siblings/nooticr-dashboard
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Keep the sibling checkouts out of this repo's diff
        run: echo '_siblings/' >> .git/info/exclude
      - name: Say which siblings are missing, and why
        env:
          HAS_TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN != '' }}
        run: |
          why="NOOTICR_VERIFY_TOKEN is set but cannot read it"; [ "$HAS_TOKEN" = true ] || why="NOOTICR_VERIFY_TOKEN is not set, and this job's own token cannot read another private repo (nooticr-server/ops/README.md, setup step 7)"
          git -C _siblings/nooticr-server rev-parse -q --verify HEAD >/dev/null 2>&1 || { echo "::error::nooticr-server could not be checked out, and the verify toolkit lives there: $why"; exit 1; }
          git -C _siblings/nooticr-dashboard rev-parse -q --verify HEAD >/dev/null 2>&1 || { echo "::warning::nooticr-dashboard could not be checked out, and rules spanning it report NOT CHECKED: $why"; }
      - name: Permissions a human granted (PR labels)
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          allow=$(printf '%s\n' $LABELS | sed -n 's/^verify-allow://p' | tr '\n' ' ')
          echo "NOOTICR_VERIFY_ALLOW=$allow" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Node repos' dependencies
        run: |
          if [ -f ./package-lock.json ]; then (cd . && npm ci --no-audit --no-fund); fi
          if [ -f ./cloudflare/package-lock.json ]; then (cd ./cloudflare && npm ci --no-audit --no-fund); fi
          if [ -f ./playwright.config.ts ]; then (cd . && npx playwright install --with-deps chromium); fi
          if [ -f _siblings/nooticr-dashboard/package-lock.json ]; then (cd _siblings/nooticr-dashboard && npm ci --no-audit --no-fund); fi
          if [ -f _siblings/nooticr-dashboard/cloudflare/package-lock.json ]; then (cd _siblings/nooticr-dashboard/cloudflare && npm ci --no-audit --no-fund); fi
          if [ -f _siblings/nooticr-dashboard/playwright.config.ts ]; then (cd _siblings/nooticr-dashboard && npx playwright install --with-deps chromium); fi
      - name: Run the gate
        run: python3 _siblings/nooticr-server/verify/verify.py --cwd "$GITHUB_WORKSPACE" run --tier ci
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nooticr-verify
          if-no-files-found: ignore
          path: |
            .verify/report.json
            verify-design/
            quests/report/surface-probe.json
            quests/report/surface-screens/
            _siblings/*/verify-design/
            _siblings/*/quests/report/surface-screens/
