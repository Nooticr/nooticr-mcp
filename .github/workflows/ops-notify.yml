# Generated by nooticr-server/ops/gen_workflows.py; edit that, then re-run it.
name: Ops feed

# #ops: after every main-branch run of the workflow that deploys this repo,
# one line saying whether each deploy job shipped; a failed deploy opens (or
# adds to) the one open `incident` issue for it (ops/pipeline/digest.py).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  deploy-report:
    name: "ops: deploy report"
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Check out the pipeline's own code (nooticr-server main)
        id: pipeline-code
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Say why the pipeline's code is missing
        if: failure() && steps.pipeline-code.outcome == 'failure'
        env:
          HAS_TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then echo "::error::nooticr-server could not be checked out: NOOTICR_VERIFY_TOKEN is not set, and this job's own token cannot read another private repo (nooticr-server/ops/README.md, setup step 7)."; else echo "::error::nooticr-server main could not be checked out with NOOTICR_VERIFY_TOKEN, or has no ops/pipeline yet (it arrives with the PR that adds it)."; fi
          exit 1
      - name: Report the deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_OPS_CHANNEL: ${{ vars.SLACK_OPS_CHANNEL }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 _pipeline/ops/pipeline/digest.py deploy --run-id "$RUN_ID"
