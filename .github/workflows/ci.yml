name: CI

# Verify every push, publish the npm package when its version moves, and
# deploy the Worker.
#
# The Worker used to deploy only when someone remembered to run
# `npm run deploy`, which is how production drifted to 1.18.1 while the repo
# and npm were on 1.19.0 — the legal pages a connector review fetches were
# 404 for days. Publishing and deploying now hang off the same green run.
#
# Runs on GitHub-hosted runners. The self-hosted box that builds orchyn-server
# is registered to that repository only, so `runs-on: ubuntu-latest` here queued
# forever with nothing to pick it up. Nothing in this workflow needs that
# machine — it is Node, a browser and wrangler — and the runners are free for
# a public repo. To move it back, register the runner at the organisation
# level (or add this repo to it) and swap the three runs-on lines.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      # Full history: the version step below asks what this push changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (root)
        run: npm ci --no-audit --no-fund

      - name: Install (worker)
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      # Four files carry the version and the Worker reports the one in src/,
      # so a hand bump that misses it ships a server that misreports itself.
      - name: The version is the same in every file that carries it
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const pkg = require("./package.json").version;
            const plugin = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8")).version;
            const m = fs.readFileSync("src/shared/tools.ts", "utf8")
              .match(/export const MCP_SERVER_VERSION = "([^"]+)";/);
            const tools = m && m[1];
            const bad = [["`.claude-plugin/plugin.json`", plugin], ["`src/shared/tools.ts`", tools]]
              .filter(([, v]) => v !== pkg);
            if (bad.length) {
              console.error(`::error title=Version drift::package.json is ${pkg}; ` +
                bad.map(([f, v]) => `${f} is ${v}`).join("; "));
              process.exit(1);
            }
            console.log(`version ${pkg} agrees across package.json, plugin.json and tools.ts`);
          '

      - name: Typecheck
        run: |
          npx tsc --noEmit
          cd cloudflare && npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: npx playwright test

      - name: Build the npm package
        run: npm run build

      # The host contract, checked with the official inspector rather than a
      # bespoke client. Every UI bug this server has shipped was a metadata or
      # mime mistake that this step would have caught: a resourceUri pointing
      # somewhere that no longer existed, a missing openai/outputTemplate, a
      # mime one host would not accept. The stdio build needs no OAuth, so it
      # runs offline on every push.
      #
      # Cursor, VS Code and Microsoft 365 Copilot all consume the same MCP Apps
      # contract as Claude, so asserting it once covers all four. Gemini is not
      # covered: its interactive UI is A2UI, a declarative JSON payload rather
      # than HTML, and Gemini 3 has no remote MCP yet — there is nothing here
      # for it to read.
      - name: Host contract (MCP Inspector CLI)
        run: |
          set -euo pipefail
          INSPECT="npx -y @modelcontextprotocol/inspector@2 --cli node dist/index.js"

          echo "::group::tools/list --app-info"
          $INSPECT --method tools/list --app-info | tee app-info.ndjson
          echo "::endgroup::"

          echo "::group::tools/list (full descriptors)"
          $INSPECT --method tools/list > tools.json
          echo "::endgroup::"

          echo "::group::resources/list"
          $INSPECT --method resources/list > resources.json
          echo "::endgroup::"

          # Portability problems are reported by the inspector itself.
          $INSPECT --method tools/list --strict > /dev/null

          # Each family must read back on the mime its host requires.
          $INSPECT --method resources/read --uri ui://orchyn/discover_social_posts > claude-res.json
          $INSPECT --method resources/read --uri ui://orchyn/discover_social_posts.html > gpt-res.json

          python3 - <<'CHECK'
          import json, sys

          fail = []
          # Tools that legitimately have no view. Anything else losing its app
          # is a regression, not a choice.
          # Tools with nothing to draw. watch_creator and unwatch_creator change
          # stored state and return a list; the catch-up that reads that state
          # does have a view, because it returns posts.
          NO_APP = {"orchyn_login", "watch_creator", "unwatch_creator"}
          MCP_APPS_MIME = "text/html;profile=mcp-app"
          APPS_SDK_MIME = "text/html+skybridge"

          rows = [json.loads(l) for l in open("app-info.ndjson") if l.strip()]
          if not rows:
              fail.append("app-info returned nothing at all")
          for r in rows:
              name = r.get("toolName")
              if name in NO_APP:
                  if r.get("hasApp"):
                      fail.append(f"{name} gained a view unexpectedly")
                  continue
              if not r.get("hasApp"):
                  fail.append(f"{name} has no app UI")
                  continue
              if not r.get("resourceUri"):
                  fail.append(f"{name} declares an app with no resourceUri")
              if r.get("resourceMimeType") != MCP_APPS_MIME:
                  fail.append(f"{name} serves {r.get('resourceMimeType')}, not {MCP_APPS_MIME}")

          # The ChatGPT half: every view must also point at its skybridge twin.
          tools = json.load(open("tools.json")).get("tools", [])
          for t in tools:
              meta = t.get("_meta") or {}
              claude = meta.get("ui/resourceUri")
              if t["name"] in NO_APP or not claude:
                  continue
              want = f"{claude}.html"
              if meta.get("openai/outputTemplate") != want:
                  fail.append(
                      f"{t['name']} outputTemplate is {meta.get('openai/outputTemplate')!r}, want {want!r}")

          res = json.load(open("resources.json")).get("resources", [])
          uris = {r["uri"] for r in res}
          mimes = {r.get("mimeType") for r in res}
          for want in (MCP_APPS_MIME, APPS_SDK_MIME):
              if want not in mimes:
                  fail.append(f"resources/list advertises no {want}")
          # Connectors created before per-tool URIs still ask for these.
          for legacy in ("ui://orchyn/view", "ui://orchyn/view.html"):
              if legacy not in uris:
                  fail.append(f"{legacy} is not listed; stale connectors will 404")

          for path, want in (("claude-res.json", MCP_APPS_MIME), ("gpt-res.json", APPS_SDK_MIME)):
              got = json.load(open(path))["contents"][0]
              if got.get("mimeType") != want:
                  fail.append(f"{path} came back {got.get('mimeType')}, want {want}")
              if "<!DOCTYPE html>" not in str(got.get("text", "")):
                  fail.append(f"{path} carries no template")

          if fail:
              print("::error title=Host contract broken::" + "; ".join(fail))
              for f in fail:
                  print(f"  - {f}")
              sys.exit(1)
          print(f"OK: {len(rows)} tools, {len(res)} resources, both host contracts intact")
          CHECK

      # Per-host verdicts from a third-party host catalog, which is the one
      # thing the official inspector does not give: it validates the MCP Apps
      # contract, this one knows what each host does with it. --offline uses the
      # bundled catalog so the result does not move with someone else's release.
      #
      # Gate on "blocked". "degraded" is expected and not ours to fix: seven
      # hosts (Claude Code, Cline, Goose, n8n, Notion, Perplexity, AgentCore)
      # render no widgets at all and fall back to the text result, which is the
      # progressive enhancement the spec asks for.
      #
      # `mcpjam apps conformance` IS run, below — but not gated on its verdict.
      # It fails us on exactly one thing: our .html resources are
      # text/html+skybridge rather than the MCP Apps mime, which is the entire
      # reason those resources exist. Gating on its pass/fail would mean
      # dropping ChatGPT to satisfy a checker that measures one of the two
      # contracts we serve. So that deviation is pinned by id and by the shape
      # of its violations, and everything else it checks is a hard gate.
      - name: Host compatibility (MCPJam)
        run: |
          set -euo pipefail
          npx -y @mcpjam/cli@5 compat --offline --format json \
            --transport stdio --command node --args dist/index.js > compat.json
          python3 - <<'CHECK'
          import json, sys
          d = json.load(open("compat.json"))
          summary = d.get("summary", {})
          hosts = d.get("hosts", [])
          blocked = [h for h in hosts if h.get("verdict") == "blocked"]
          for h in hosts:
              print(f"  {h.get('hostLabel'):16} {h.get('verdict')}")
          fail = []
          if blocked:
              fail.append("blocked on " + ", ".join(h.get("hostLabel", "?") for h in blocked))

          # Blocked alone is far too weak a gate. Stripping ui/resourceUri from
          # every tool blocks nothing — it just quietly drops the working hosts
          # from nine to four, because a host with no view to render simply
          # falls back to text and calls that "degraded". So name the two hosts
          # this product ships for, and hold a floor under the rest.
          verdicts = {h.get("hostId"): h.get("verdict") for h in hosts}
          for host_id, label in (("claude", "Claude"), ("chatgpt", "ChatGPT")):
              if verdicts.get(host_id) != "works":
                  fail.append(f"{label} is {verdicts.get(host_id)!r}, want 'works'")

          works = summary.get("works", 0)
          if works < 9:
              fail.append(f"only {works} hosts working, expected at least 9")

          widgets = (d.get("widgets") or {}).get("total", 0)
          if widgets < 20:
              fail.append(f"only {widgets} interactive views advertised")

          if fail:
              print("::error title=Host compatibility::" + "; ".join(fail))
              for f in fail:
                  print(f"  - {f}")
              sys.exit(1)
          print(f"OK: {widgets} views, {works} hosts working, Claude and ChatGPT both working")
          CHECK

      # Catches a broken wrangler config or a missing binding before anything
      # has been published.
      # Everything MCP Apps conformance checks EXCEPT the deliberate
      # dual-mime deviation. Pinning by id alone would be too loose — a real
      # regression could hide inside one of those two checks — so every
      # violation they report must also be the skybridge objection we expect.
      # Anything else, in any check, fails the build.
      - name: MCP Apps conformance (deviation pinned)
        run: |
          set -euo pipefail
          npx -y @mcpjam/cli@5 apps conformance --format json \
            --transport stdio --command node --args dist/index.js > conformance.json || true
          python3 - <<'CHECK'
          import json, sys

          d = json.load(open("conformance.json"))

          # The two checks that object to our ChatGPT twin, and nothing else.
          EXPECTED = {"ui-listed-resources-valid", "ui-resource-contents-valid"}

          failed = [c for c in d.get("checks", [])
                    if c.get("status") not in ("passed", "not_applicable", "skipped")]
          unexpected = [c["id"] for c in failed if c.get("id") not in EXPECTED]
          if unexpected:
              print("::error title=MCP Apps conformance::New conformance failure(s): "
                    + ", ".join(unexpected))
              sys.exit(1)

          # A pinned check must still only be failing for the reason we pinned it.
          for c in failed:
              for v in c.get("details", {}).get("violations", []):
                  if "text/html+skybridge" not in v:
                      print("::error title=MCP Apps conformance::"
                            f"{c['id']} failed for a new reason: {v}")
                      sys.exit(1)

          disc = d.get("discovery", {})
          if not disc.get("toolCount") or not disc.get("uiToolCount"):
              print("::error title=MCP Apps conformance::"
                    f"discovery found nothing to check: {disc}")
              sys.exit(1)

          cats = d.get("categorySummary", {})
          print(f"OK: {d.get('summary')}; only the pinned dual-mime deviation fails. "
                f"tools {cats.get('tools', {}).get('passed')}/{cats.get('tools', {}).get('total')} "
                f"passed, {disc.get('toolCount')} tools and "
                f"{disc.get('checkedUiResourceCount')} UI resources checked.")
          CHECK

      - name: Worker build (dry run)
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run

  version:
    name: Version
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      published: ${{ steps.pkg.outputs.published }}
      can_deploy: ${{ steps.cf.outputs.can_deploy }}
    steps:
      # Full history: the version step below asks what this push changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Publishing the same version twice is a hard error, so decide here
      # whether this commit actually moved it — and move it here when the
      # commit changed what npm ships but left the version alone.
      #
      # That case is not hypothetical. 1.26.8 shipped the ChatGPT view twice,
      # once blinking and once fixed: the fix reached the Worker, which deploys
      # on every green push, and never reached npm, which publishes only when
      # the version moves. Anyone on `npx @orchyn/mcp` kept the broken view
      # while production had the fix, and the repo and npm quietly diverged.
      #
      # The bump is earned by a change under src/, not by the version merely
      # being on npm already — which is also what stops the release commit this
      # step pushes from bumping again on its own push, and releasing forever.
      - name: Decide the version to publish
        id: pkg
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          emit() {
            echo "version=$1" >> "$GITHUB_OUTPUT"
            echo "published=$2" >> "$GITHUB_OUTPUT"
          }

          if ! npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is new — it will be published."
            emit "$VERSION" false
            exit 0
          fi

          if [ "${{ github.event_name }}" != "push" ] \
             || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "not a push to main — publish will be skipped."
            emit "$VERSION" true
            exit 0
          fi

          # Anchor on the last released tree rather than on this push's range.
          # A push whose run never happens — suppressed, cancelled, a runner
          # that died — would otherwise strand its src change unversioned for
          # good, because the next push's range no longer contains it. Against
          # the tag for the version npm actually serves, the next run picks it
          # up on its own. A missing tag means we cannot prove the tree is
          # unchanged, so it bumps once and writes the tag it was missing.
          ANCHOR="refs/tags/v$VERSION"
          if git rev-parse -q --verify "$ANCHOR" >/dev/null \
             && git diff --quiet "$ANCHOR" HEAD -- src; then
            echo "$NAME@$VERSION is already on npm and src is unchanged since v$VERSION — publish will be skipped."
            emit "$VERSION" true
            exit 0
          fi

          npm version patch --no-git-tag-version >/dev/null
          NEXT="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("fs");
            const v = require("./package.json").version;
            const p = ".claude-plugin/plugin.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            // The Worker reports this one, not package.json: it is bundled, so
            // it cannot read the manifest at runtime. Leaving it behind is how
            // /health served 1.26.8 while npm served 1.26.9.
            const t = "src/shared/tools.ts";
            const src = fs.readFileSync(t, "utf8");
            const next = src.replace(/export const MCP_SERVER_VERSION = "[^"]+";/,
              `export const MCP_SERVER_VERSION = \"${v}\";`);
            if (next === src) throw new Error("MCP_SERVER_VERSION not found in " + t);
            fs.writeFileSync(t, next);
          '
          echo "src changed under a version already on npm — bumped $VERSION -> $NEXT."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .claude-plugin/plugin.json src/shared/tools.ts
          # [skip ci]: this push would otherwise start a run that cancels this
          # one mid-publish — the concurrency group cancels in progress.
          git commit -m "release: $NEXT [skip ci]"
          # A file the sync rewrote but the add missed is invisible otherwise:
          # it stays in the runner, the release commit ships without it, and the
          # version it carries is wrong everywhere that file is read. That is
          # exactly how 1.26.10 reached npm with the Worker still saying 1.26.9.
          if ! git diff --quiet; then
            echo "::error title=Release commit is incomplete::the bump changed files it did not stage"
            git --no-pager diff --name-only
            exit 1
          fi
          git push origin "HEAD:${{ github.ref_name }}"
          emit "$NEXT" false

      # The secrets context cannot be read from a job-level `if`, so the
      # decision is made here and passed down as an output.
      - name: Can we deploy the Worker?
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Worker deploy skipped::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed and mcp.orchyn.com may be behind main. Create a token with Workers Scripts:Edit and add it as a repository secret."
          fi

      # Drift is what this workflow exists to prevent, so say plainly when
      # production is behind — even on the runs that cannot fix it themselves.
      - name: Compare production against this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LIVE="$(curl -fsS -m 20 https://mcp.orchyn.com/health \
                  | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).mcpVersion' 2>/dev/null || echo unknown)"
          echo "repo=${{ steps.pkg.outputs.version }}  live=$LIVE"
          if [ "$LIVE" != "${{ steps.pkg.outputs.version }}" ] && [ "${{ steps.cf.outputs.can_deploy }}" != "true" ]; then
            echo "::warning title=Production is behind main::mcp.orchyn.com serves $LIVE, this commit is ${{ steps.pkg.outputs.version }}, and no deploy token is configured."
          fi

  publish:
    name: Publish to npm
    needs: [verify, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      # main, not the pushed SHA: verify may have committed the version bump
      # on top of it, and that is the tree npm must receive.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The tag is what the next run measures src against, so losing it is not
      # cosmetic — it would bump again for a tree that never changed. This step
      # used to swallow both failures, which is why the repo carries eight tags
      # for thirty-odd releases.
      - name: Tag the release
        run: |
          set -euo pipefail
          V="v${{ needs.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "$V is already tagged."
            exit 0
          fi
          git tag "$V"
          git push origin "$V"

  deploy:
    name: Deploy Worker
    needs: [verify, version]
    # Deploys every green push to main, whether or not the package version
    # moved — the Worker and the npm package version independently. Skipped
    # (not failed) when no token is configured; the version job warns in that
    # case.
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.version.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      # main, so /health reports the version npm just received rather than the
      # one it replaced — production drifting from the package is the whole
      # reason this job stopped being a manual step.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both installs, and the root one is not optional. The Worker bundles
      # ../src/shared/*, and esbuild resolves a bare import by walking up from
      # the file that wrote it — so `@modelcontextprotocol/sdk` and `zod` are
      # looked for in <root>/node_modules, never in cloudflare/node_modules,
      # which is a sibling of src/ rather than an ancestor. Declaring them in
      # cloudflare/package.json is not enough on its own.
      #
      # The verify job happens to install both, which is why its
      # `wrangler deploy --dry-run` passed while this job failed on the same
      # commit.
      - name: Install (root)
        run: npm ci --no-audit --no-fund

      - name: Install (worker)
        working-directory: cloudflare
        run: npm ci --no-audit --no-fund

      - name: Deploy
        working-directory: cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The deploy is only real if the live site says so. This is the check
      # that would have caught 1.18.1 sitting in production for days.
      - name: Verify what is actually live
        run: |
          set -euo pipefail
          BASE=https://mcp.orchyn.com
          WANT="${{ needs.version.outputs.version }}"
          echo "Waiting for $WANT to serve…"
          for _ in $(seq 1 30); do
            sleep 4
            LIVE="$(curl -fsS -m 20 "$BASE/health" \
                    | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).mcpVersion' 2>/dev/null || echo "")"
            [ "$LIVE" = "$WANT" ] && echo "  serving $LIVE" && break
          done
          fail=0
          # Pages a connector review fetches. These were 404 in production.
          for p in / /documentation /terms /privacy /dashboard /robots.txt /sitemap.xml /health \
                   /.well-known/oauth-authorization-server \
                   /.well-known/oauth-protected-resource; do
            code="$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$BASE$p")"
            printf '  %-46s %s\n' "$p" "$code"
            [ "$code" = "200" ] || fail=1
          done
          # An unauthenticated MCP call must be a clean 401, not a crash.
          code="$(curl -s -o /dev/null -m 20 -w '%{http_code}' -X POST "$BASE/mcp" \
                   -H 'content-type: application/json' \
                   -d '{"jsonrpc":"2.0","id":1,"method":"initialize"}')"
          printf '  %-46s %s\n' "POST /mcp (unauthenticated)" "$code"
          [ "$code" = "401" ] || fail=1
          if [ "$fail" != "0" ]; then
            echo "::error::Live smoke test failed — production is not serving what we just deployed."
            exit 1
          fi
          echo "Live smoke test passed."
