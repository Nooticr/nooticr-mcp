# Generated by nooticr-server/ops/gen_workflows.py; edit that, then re-run it.
name: PR pipeline

# PR -> security review (a Claude session) + Claude Code Review (managed) +
# nooticr-verify + CI -> decide (code, not a model) -> fixer session, or merge.
#
# decide.py (nooticr-server/ops/pipeline) judges the head commit and dispatches
# the next step as a workflow_dispatch, which runs from the default branch: the
# jobs that approve and merge never execute code from the PR they judge, and
# re-check the exact commit first. Low-risk PRs are approved by the approver App;
# anything else waits at the merge-approval environment for a human.
#
# Needs: CLAUDE_CODE_OAUTH_TOKEN, NOOTICR_VERIFY_TOKEN, SLACK_BOT_TOKEN (secrets);
# NOOTICR_APPROVER_APP_ID, SLACK_PRS_CHANNEL (vars); the Claude GitHub App
# installed; environments `auto-merge` and `merge-approval` (the second with
# required reviewers), both limited to the default branch and each holding
# NOOTICR_APPROVER_PRIVATE_KEY as an environment secret, never a repo secret:
# a repo secret is readable by any same-repo PR's own pull_request run.
# Auto-merge allowed in the repo settings. See nooticr-server/ops/README.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI, Verify]
    types: [completed]
  check_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        type: number
        required: true
      mode:
        type: choice
        options: [decide, fix, merge, gate]
        required: true
        default: decide
      sha:
        description: The head commit the decision was made on (fix/merge/gate)
        required: false

permissions: {}

jobs:
  security-review:
    name: "pipeline: security review"
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      checks: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Pick the sibling branches
        id: sibling-refs
        # A change spread over the three repos lives on one branch name in each;
        # checking this repo's branch against the siblings' main would test a
        # combination that will never exist. Same name if the sibling has it,
        # main otherwise.
        env:
          TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-server" "$BRANCH" >/dev/null 2>&1; then echo "server=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "server=main" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-dashboard" "$BRANCH" >/dev/null 2>&1; then echo "dashboard=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "dashboard=main" >> "$GITHUB_OUTPUT"; fi
      - name: Check out nooticr-server
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-server
          ref: ${{ steps.sibling-refs.outputs.server }}
          path: _siblings/nooticr-server
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Check out nooticr-dashboard
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-dashboard
          ref: ${{ steps.sibling-refs.outputs.dashboard }}
          path: _siblings/nooticr-dashboard
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Keep the sibling checkouts out of this repo's diff
        run: echo '_siblings/' >> .git/info/exclude
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/security-verdict ${{ github.event.pull_request.number }} ${{ github.event.pull_request.base.ref }}"
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(mkdir -p .pipeline)"
      - name: Check out the pipeline's own code (nooticr-server main)
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Record the verdict as the claude-security-review check
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 _pipeline/ops/pipeline/security_check.py --verdict .pipeline/security-verdict.json
  decide:
    name: "pipeline: decide"
    needs: [security-review]
    if: >-
      always() && (
        github.event_name == 'pull_request' || github.event_name == 'schedule' ||
        github.event_name == 'workflow_run' ||
        (github.event_name == 'check_run' && github.event.check_run.name == 'Claude Code Review') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'decide'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pipeline-decide-${{ github.event.pull_request.number || inputs.pr || github.run_id }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: write
    steps:
      - name: The inputs are what they claim to be
        if: github.event_name == 'workflow_dispatch'
        env:
          PR: ${{ inputs.pr }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr is not a PR number"; exit 1; }
      - name: Check out the pipeline's own code (nooticr-server main)
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PRS_CHANNEL: ${{ vars.SLACK_PRS_CHANNEL }}
          PR: ${{ inputs.pr }}
        run: |
          if [ -n "$PR" ]; then python3 _pipeline/ops/pipeline/decide.py --pr "$PR"; else python3 _pipeline/ops/pipeline/decide.py --event "$GITHUB_EVENT_PATH"; fi
  fix:
    name: "pipeline: fix"
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: pipeline-fix-${{ inputs.pr }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: The inputs are what they claim to be
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr is not a PR number"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha is not a full commit sha"; exit 1; }
      - name: Check out the pipeline's own code (nooticr-server main)
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Still the commit that was judged, still a fix, and count the round
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The same judgement decide made, re-run here: a dispatch by hand gets no
          # fixer the decision would not have sent (a fork, a PR out of rounds).
          if ! python3 _pipeline/ops/pipeline/decide.py --pr "$PR" --check "$SHA" --mode fix >/dev/null; then echo "::notice::Not a fix at $SHA any more; nothing to do."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,labels -q '.headRefName + " " + ([.labels[].name | select(startswith("pipeline:fix-"))] | length | tostring)')
          read -r ref rounds <<< "$head"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label "pipeline:fixing" --add-label "pipeline:fix-$((rounds + 1))"
      - uses: actions/checkout@v4
        if: steps.pr.outputs.skip != '1'
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0
      - name: Pick the sibling branches
        id: sibling-refs
        # A change spread over the three repos lives on one branch name in each;
        # checking this repo's branch against the siblings' main would test a
        # combination that will never exist. Same name if the sibling has it,
        # main otherwise.
        env:
          TOKEN: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          BRANCH: ${{ steps.pr.outputs.ref }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-server" "$BRANCH" >/dev/null 2>&1; then echo "server=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "server=main" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/Nooticr/nooticr-dashboard" "$BRANCH" >/dev/null 2>&1; then echo "dashboard=$BRANCH" >> "$GITHUB_OUTPUT"; else echo "dashboard=main" >> "$GITHUB_OUTPUT"; fi
      - name: Check out nooticr-server
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-server
          ref: ${{ steps.sibling-refs.outputs.server }}
          path: _siblings/nooticr-server
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Check out nooticr-dashboard
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Nooticr/nooticr-dashboard
          ref: ${{ steps.sibling-refs.outputs.dashboard }}
          path: _siblings/nooticr-dashboard
          fetch-depth: 0
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
      - name: Keep the sibling checkouts out of this repo's diff
        run: echo '_siblings/' >> .git/info/exclude
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.skip != '1'
        with:
          node-version: "22"
      - uses: anthropics/claude-code-action@v1
        if: steps.pr.outputs.skip != '1'
        # No github_token here: the action pushes as the Claude GitHub App, and
        # only then do the pushes trigger the pipeline again (GITHUB_TOKEN's don't).
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/fix-pr ${{ inputs.pr }}"
          claude_args: --max-turns 80
      - name: Hand the PR back to the pipeline
        if: always() && steps.pr.outputs.skip != '1'
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "pipeline:fixing"
  merge:
    name: "pipeline: merge (low risk)"
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No reviewers, but limited to the default branch: it is what keeps the
    # approver key out of every run that executes a PR's own workflow file.
    environment: auto-merge
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: The inputs are what they claim to be
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr is not a PR number"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha is not a full commit sha"; exit 1; }
      - name: Check out the pipeline's own code (nooticr-server main)
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Still low risk and ready, at the same commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 _pipeline/ops/pipeline/decide.py --pr "$PR" --check "$SHA" --mode merge
      - name: The approver's token
        id: approver
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NOOTICR_APPROVER_APP_ID }}
          private-key: ${{ secrets.NOOTICR_APPROVER_PRIVATE_KEY }}
      - name: Approve and arm auto-merge
        env:
          GH_TOKEN: ${{ steps.approver.outputs.token }}
        run: |
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body "Approved by the pipeline (low risk: every gate green) at $SHA."
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$SHA"
  gate:
    name: "pipeline: human merge approval"
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A human approves this environment's deployment in GitHub; until then the
    # job waits without a runner. The Claude sessions hold no token that can.
    environment: merge-approval
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: The inputs are what they claim to be
        env:
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::pr is not a PR number"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha is not a full commit sha"; exit 1; }
      - name: Check out the pipeline's own code (nooticr-server main)
        uses: actions/checkout@v4
        with:
          repository: Nooticr/nooticr-server
          ref: main
          path: _pipeline
          token: ${{ secrets.NOOTICR_VERIFY_TOKEN || github.token }}
          sparse-checkout: ops/pipeline
      - name: Still ready, at the same commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 _pipeline/ops/pipeline/decide.py --pr "$PR" --check "$SHA" --mode gate
      - name: The approver's token
        id: approver
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NOOTICR_APPROVER_APP_ID }}
          private-key: ${{ secrets.NOOTICR_APPROVER_PRIVATE_KEY }}
      - name: Approve and arm auto-merge
        env:
          GH_TOKEN: ${{ steps.approver.outputs.token }}
        run: |
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body "Approved by the pipeline, after a human approved the merge-approval gate at $SHA."
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$SHA"
